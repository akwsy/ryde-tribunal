name: guards

on:
  pull_request:
    branches: [main]

jobs:
  boundaries:
    name: ownership, one-branch, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: One branch per specialist
        run: bash tools/ci/check-one-branch.sh

      - name: Path ownership
        env:
          BASE: origin/${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
        run: bash tools/ci/check-ownership.sh

      - name: Secrets and personal data
        env:
          BASE: origin/${{ github.base_ref }}
        run: bash tools/ci/check-secrets.sh
