name: guards

on:
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: secrets and personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets and personal data
        env:
          BASE: origin/${{ github.base_ref }}
        run: bash tools/ci/check-secrets.sh
