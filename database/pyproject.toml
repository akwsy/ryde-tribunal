[project]
name = "ryde-tribunal-database"
version = "0.1.0"
description = "PostgreSQL schema, deterministic seed data, importers, and read accessors for Ryde Tribunal."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.17.1",
  "psycopg[binary]==3.2.13",
  "pydantic==2.12.4",
  "SQLAlchemy==2.0.44",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
