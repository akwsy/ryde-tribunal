<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#087f75"/></marker></defs><rect width="1440" height="900" fill="#f4f8f7"/><style>text{font-family:Arial,sans-serif;fill:#173d37}.title{font-size:34px;font-weight:bold}.head{font-size:22px;font-weight:bold}.sub{font-size:17px;fill:#54736e}.box{fill:white;stroke:#cee2dc;stroke-width:2;rx:16}.line{fill:none;stroke:#087f75;stroke-width:3;marker-end:url(#arrow)}</style><text x="70" y="70" class="title">Ryde Tribunal — evidence, policy and human oversight</text><rect class="box" x="70" y="125" width="570" height="110"/><text class="head" x="94" y="169">Reviewer workspace</text><text class="sub" x="94" y="207">File • inspect evidence • approve or override</text><rect class="box" x="70" y="320" width="250" height="130"/><text class="head" x="94" y="364">Rider Advocate</text><text class="sub" x="94" y="402">Read-only retrieval</text><rect class="box" x="390" y="320" width="250" height="130"/><text class="head" x="414" y="364">Driver Advocate</text><text class="sub" x="414" y="402">Read-only retrieval</text><rect class="box" x="760" y="320" width="300" height="130"/><text class="head" x="784" y="364">Impartial Judge</text><text class="sub" x="784" y="402">Claims + policy + facts</text><rect class="box" x="70" y="560" width="570" height="125"/><text class="head" x="94" y="604">Source records / PostgreSQL</text><text class="sub" x="94" y="642">GPS • fares • chat • events • profiles</text><rect class="box" x="760" y="125" width="570" height="110"/><text class="head" x="784" y="169">Current published policy</text><text class="sub" x="784" y="207">Official sources + distinct operating rules</text><rect class="box" x="760" y="560" width="570" height="125"/><text class="head" x="784" y="604">Validation and escalation</text><text class="sub" x="784" y="642">Citations • remedies • gaps • confidence</text><rect class="box" x="760" y="750" width="570" height="100"/><text class="head" x="784" y="794">Human review / recorded decision</text><text class="sub" x="784" y="832">Model proposal retained separately</text><path class="line" d="M180 235 V320"/><path class="line" d="M500 235 V320"/><path class="line" d="M195 560 V450"/><path class="line" d="M515 560 V450"/><path class="line" d="M320 385 H390"/><path class="line" d="M640 385 H760"/><path class="line" d="M1045 235 V320"/><path class="line" d="M910 450 V560"/><path class="line" d="M1045 685 V750"/><text class="sub" x="70" y="790">Persisted agent actions and source provenance</text><text class="sub" x="70" y="825">No live outcome labels • No automated financial execution</text></svg>