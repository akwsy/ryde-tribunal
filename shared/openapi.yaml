openapi: 3.1.0
info:
  title: Ryde Tribunal API
  version: 0.5.5
  description: |
    Public API contract for Ryde Tribunal. Requests and responses are validated against this
    machine-readable schema. Synthetic sample records and imported records use the same case
    workflow, with provenance retained as record metadata.
security:
  - JudgeSession: []
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local development

tags:
  - name: disputes
  - name: evidence
  - name: metrics
  - name: archive
  - name: trips
  - name: imports
  - name: policy
  - name: system

paths:
  /demo/session:
    get:
      tags: [system]
      operationId: getDemoSession
      summary: Check hosted judge access
      security: []
      responses:
        '200':
          description: Session status; access_required is false for normal local operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoSession' }
    post:
      tags: [system]
      operationId: signInDemo
      summary: Sign in to the synthetic judge demo
      security: []
      description: Requires a same-origin browser request. Sets an HttpOnly, Secure session cookie. Normal local mode does not require a passcode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passcode]
              additionalProperties: false
              properties:
                passcode: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoSession' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AccessDenied' }
    delete:
      tags: [system]
      operationId: signOutDemo
      summary: Clear the judge session
      description: Requires a same-origin browser request; clears the browser session cookie.
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoSession' }
        '403': { $ref: '#/components/responses/AccessDenied' }
  /demo/guest-session:
    post:
      tags: [system]
      operationId: createGuestDemoSession
      summary: Open a read-only guest profile
      security: []
      description: Starts an expiring, read-only session for exploring synthetic demo records. All write requests are rejected by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              additionalProperties: false
              properties:
                profile: { type: string, enum: [reviewer-preview, evidence-explorer] }
      responses:
        '200':
          description: Read-only guest profile opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoSession' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /disputes:
    post:
      tags: [disputes]
      operationId: fileDispute
      summary: File a dispute
      description: |
        All category values in the closed vocabulary may be filed. Categories without an automated
        policy implementation are retained and routed to human review without a model ruling.
      parameters:
        - $ref: '#/components/parameters/ReviewerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileDisputeRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileDisputeResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
    get:
      tags: [disputes]
      operationId: listDisputes
      summary: List disputes
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CaseStatus' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: urgency_min, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: needs_review, in: query, schema: { type: boolean } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, urgency, -urgency, confidence, -confidence] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSummaryPage' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }

  /disputes/{case_id}:
    get:
      tags: [disputes]
      operationId: getDispute
      summary: Get a live or historical case
      description: Historical cases use the same detail route and ID formats and are read-only. The `case_source` field identifies the record source; archived records return stored rulings with `judge` and `advocates` null.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }

  /disputes/{case_id}/adjudicate:
    post:
      tags: [disputes]
      operationId: adjudicateDispute
      description: |
        Runs the tribunal. Idempotent per Idempotency-Key and concurrency-safe: a repeated key with a
        different body is 409.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/ReviewerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Adjudicated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }

  /disputes/{case_id}/approve:
    post:
      tags: [disputes]
      operationId: approveResolution
      summary: Reviewer accepts the proposed resolution
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/ReviewerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /disputes/{case_id}/override:
    post:
      tags: [disputes]
      operationId: overrideResolution
      description: |
        Reviewer overrides a resolved case. The override is APPENDED to case_history and never replaces
        the original ruling.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/ReviewerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /disputes/{case_id}/trace:
    get:
      tags: [disputes]
      operationId: getAdjudicationTrace
      summary: Recorded agent actions and evidence requests; never private chain-of-thought
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string, pattern: '^DSP-\d{6}$' } }
      responses:
        '200':
          description: Persisted trace (empty for historical records without a recorded trace)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjudicationTrace' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }

  /disputes/{case_id}/history:
    get:
      tags: [disputes]
      operationId: getCaseHistory
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoryEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /evidence/{evidence_id}:
    get:
      tags: [evidence]
      operationId: getEvidence
      description: |
        Scoping is resolved SERVER-SIDE from the record's own `case_id`. The client sends the evidence id
        and nothing else — no `case_id` query parameter. An evidence id is globally unique, so requiring
        the caller to also name the case would be redundant and would not authorize anything (the caller
        supplies both values).

        In the local configuration, evidence access is not tied to individual reviewer accounts, so
        any valid evidence id is retrievable. This is not user authentication. Add authentication
        before deploying to multiple users. `visibility` is still honoured for party-scoped access.
      parameters:
        - { name: evidence_id, in: path, required: true, schema: { type: string, pattern: '^EV-\d{6}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '404': { $ref: '#/components/responses/NotFound' }

  /evidence/{evidence_id}/download:
    get:
      tags: [evidence]
      operationId: downloadPartyAttachment
      summary: Download the original file for party-submitted evidence
      parameters:
        - { name: evidence_id, in: path, required: true, schema: { type: string, pattern: '^EV-\\d{6}$' } }
      responses:
        '200':
          description: Original PDF, JPEG, or PNG; party uploads remain unverified
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  /metrics/overview:
    get:
      tags: [metrics]
      operationId: getMetricsOverview
      parameters:
        - { name: from, in: query, required: true, description: Inclusive Singapore-local start date, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: Inclusive Singapore-local end date, schema: { type: string, format: date } }
        - { name: tz, in: query, schema: { type: string, enum: [Asia/Singapore], default: Asia/Singapore } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsOverview' }

  /metrics/timeseries:
    get:
      tags: [metrics]
      operationId: getMetricsTimeseries
      parameters:
        - { name: from, in: query, required: true, description: Inclusive filed-date start, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: Inclusive filed-date end, schema: { type: string, format: date } }
        - { name: tz, in: query, schema: { type: string, enum: [Asia/Singapore], default: Asia/Singapore } }
        - { name: group_by, in: query, schema: { type: string, enum: [category, status, filed_by, provider], default: category } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsTimeseries' }

  /metrics/breakdown:
    get:
      tags: [metrics]
      operationId: getMetricsBreakdown
      parameters:
        - { name: from, in: query, required: true, description: Inclusive filed-date start, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: Inclusive filed-date end, schema: { type: string, format: date } }
        - { name: tz, in: query, schema: { type: string, enum: [Asia/Singapore], default: Asia/Singapore } }
        - { name: by, in: query, schema: { type: string, enum: [category, status, filed_by, provider], default: category } }
      responses:
        '200':
          description: Pie-chart values for the requested filed-date range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsBreakdown' }

  /metrics/ai-usage:
    get:
      tags: [metrics]
      operationId: getAiReviewUsage
      summary: Report selective AI review share against the 25% target
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: tz, in: query, schema: { type: string, enum: [Asia/Singapore], default: Asia/Singapore } }
      responses:
        '200':
          description: Adjudicated cases and the share sent to Gemini review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiReviewUsage' }

  /archive/disputes:
    get:
      tags: [archive]
      operationId: listArchivedDisputes
      summary: List archived dispute history
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        '200':
          description: Historical cases with aggregate counts and separate ruling stages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveDisputePage' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }

  /trips:
    get:
      tags: [trips]
      operationId: searchTrips
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Trips available for simulated dispute filing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripSearchPage' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }

  /imports/company-data:
    post:
      tags: [imports]
      operationId: importCompanyData
      summary: Import a validated ZIP of related company CSV files
      parameters:
        - $ref: '#/components/parameters/ReviewerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: New company-ID rows imported; duplicate IDs skipped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { description: Invalid ZIP or unsupported CSV bundle format }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }

  /policy/{version}:
    get:
      tags: [policy]
      operationId: getPolicy
      description: Returns the policy document actually loaded for that version.
      parameters:
        - { name: version, in: path, required: true, schema: { type: string, example: ryde-policy-0.1.1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDocument' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      tags: [system]
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    JudgeSession:
      type: apiKey
      in: cookie
      name: __Host-ryde_session
      description: Required only when hosted demo access is enabled. Reviewer headers are audit labels, not authentication. All protected endpoints can return 401, 403, or 429 in hosted demo mode.
  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string, pattern: '^DSP-\d{6}$' }
    ReviewerId:
      name: X-Reviewer-Id
      in: header
      required: true
      description: Reviewer identity for audit history. Required on every mutating request.
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 128 }

  responses:
    AuthenticationRequired:
      description: Judge sign-in is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AccessDenied:
      description: Wrong request origin or an action disabled in the synthetic demo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many attempts; wait before retrying
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    DatabaseUnavailable:
      description: |
        The data layer is unreachable. A failure NEVER returns a ruling — the frontend must render an
        error state, not an empty case.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    DemoSession:
      type: object
      required: [access_required, authenticated]
      properties:
        access_required: { type: boolean }
        authenticated: { type: boolean }
        mode: { type: string, enum: [reviewer, guest] }
        profile: { type: [string, 'null'], enum: [judge-reviewer, reviewer-preview, evidence-explorer, null] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [validation_error, not_found, conflict, database_unavailable, provider_unavailable, model_output_invalid, internal_error, authentication_required, access_denied, demo_restricted, demo_read_only, rate_limited]
            message: { type: string }
            details: { type: object, additionalProperties: true }

    Money:
      type: object
      description: |
        Integer minor units plus currency. NEVER a float. 325 SGD = S$3.25. Clients must format with
        Intl.NumberFormat('en-SG', { style: 'currency', currency }) and must not do arithmetic on a
        display string.
      required: [amount_cents, currency]
      properties:
        amount_cents: { type: integer }
        currency: { type: string, minLength: 3, maxLength: 3, example: SGD }

    Category:
      type: string
      description: All eight categories receive automated intake and evidence processing. Fare and cancellation-fee categories may receive a rules-based final proposal when verified records and policy are decisive. Damage, safety, lost-item and conduct cases receive triage and recommendations, with the final decision reserved for a human.
      enum: [route_deviation, no_show_charge, fare_calculation, other_cancellation_fee, property_damage, safety_incident, lost_item, conduct_complaint]

    CaseStatus:
      type: string
      description: Processing is durable while the agents review a live case; queued cases are eligible for automatic processing.
      enum: [queued, processing, resolved, escalated, pending_review, overridden]

    RulingType:
      type: string
      enum: [refund, compensation, no_action]

    ReasonCode:
      type: string
      description: Closed vocabulary. A value outside it is rejected with 422.
      enum: [policy_misapplied, evidence_misweighted, evidence_missing, fraud_suspected, goodwill, safety_override, other]

    VerificationStatus:
      type: string
      enum: [verified, unverified, disputed, unverifiable]

    ProviderKind:
      type: string
      description: |
        deterministic-mock means a SCRIPTED fallback produced this text, not a model. rules-engine
        means a narrow deterministic policy path resolved a clear case without a model. Integrity
        rule I-6: the UI must visibly distinguish provider-backed reasoning from either path.
      enum: [llm, deterministic-mock, rules-engine]

    Provider:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/ProviderKind' }
        display_name: { type: string, description: Provider name shown to the reviewer; never the model name }
        model: { type: string, nullable: true }
        policy_version: { type: string, nullable: true }

    Verification:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/VerificationStatus' }
        method: { type: string, nullable: true }
        uncertainty_pct:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: May be absent. The UI must render that case rather than assuming zero.

    Citation:
      type: object
      required: [evidence_id, field_path, observed_value, valid]
      properties:
        evidence_id: { type: string, pattern: '^EV-\d{6}$' }
        field_path: { type: string, example: route.actual_distance_km }
        observed_value: { description: The value the claim relies on, as read from the record }
        supports: { type: string, nullable: true }
        valid:
          type: boolean
          description: |
            REQUIRED, not defaulted. False when semantic validation rejected the citation (integrity
            rule I-3). It was previously declared with `default: true`, which the backend read as
            omittable and the frontend had to interpret — the frontend chose "absent means invalid",
            so a cleanly-validated case rendered with every citation marked invalid in red. Absence is
            now a schema violation rather than a value either side may infer.

    Claim:
      type: object
      required: [text, citations]
      properties:
        text: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }

    RejectedEvidence:
      type: object
      required: [evidence_id, reason]
      properties:
        evidence_id: { type: string }
        reason: { type: string }

    AdvocateOutput:
      type: object
      required: [argument, claims, policy_references, invalid_citation_count, provider]
      properties:
        argument: { type: string, description: Case-specific natural-language position. }
        claims:
          type: array
          items: { $ref: '#/components/schemas/Claim' }
        policy_references:
          type: array
          items: { type: string, example: RP-ROUTE-003 }
        rejected_evidence:
          type: array
          items: { $ref: '#/components/schemas/RejectedEvidence' }
        invalid_citation_count: { type: integer, minimum: 0 }
        invalid_citation_rate:
          type: number
          minimum: 0
          maximum: 1
          description: |
            `invalid_citation_count` over total citations. Named deliberately: it is an
            INVALID-CITATION rate, not an unsupported-claim rate. A citation can be structurally valid
            and still fail to support its claim, so do not present this as a measure of argument
            soundness (integrity rule I-3).
        provider: { $ref: '#/components/schemas/Provider' }

    Advocates:
      type: object
      required: [rider, driver]
      properties:
        rider: { $ref: '#/components/schemas/AdvocateOutput' }
        driver: { $ref: '#/components/schemas/AdvocateOutput' }

    RecommendedAction:
      type: object
      required: [description]
      properties:
        description: { type: string, example: voucher waiver recommendation }
        delivery: { type: string, enum: [voucher, none, unspecified], description: Recommended delivery only; no funds or vouchers are executed. }
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'

    AdjudicationTrace:
      type: object
      required: [case_id, events]
      properties:
        case_id: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/TraceEvent' }

    TraceEvent:
      type: object
      required: [at, actor, event, summary, evidence_ids]
      properties:
        at: { type: string, format: date-time }
        actor: { type: string }
        event: { type: string }
        summary: { type: string }
        evidence_ids: { type: array, items: { type: string } }
        provider: { type: string, nullable: true }
        reason_codes: { type: array, items: { type: string }, description: Stable reason codes for model-free human review routing. }

    PolicySource:
      type: object
      required: [url, title, retrieved_at]
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        retrieved_at: { type: string, format: date }
        effective_from: { type: string, nullable: true }
        context: { type: string }

    EscalationReason:
      type: string
      enum:
        - confidence_below_threshold
        - materially_uncertain
        - contradictory_evidence
        - insufficient_evidence
        - inaccurate_evidence
        - high_impact
        - safety_category
        - exceeds_ruling_cap
        - fraud_risk

    Escalation:
      type: object
      required: [escalated, reasons]
      properties:
        escalated: { type: boolean }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/EscalationReason' }
        human_review_summary:
          type: string
          nullable: true
          description: Required when escalated is true (RP-ESC-005).

    JudgeOutput:
      type: object
      required: [ruling_type, recommended_action, confidence, reasoning, evidence_references, decisive_facts, policy_references, escalation, provider]
      properties:
        ruling_type: { $ref: '#/components/schemas/RulingType' }
        recommended_action: { $ref: '#/components/schemas/RecommendedAction' }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          multipleOf: 0.001
          description: |
            Float 0.000-1.000, 3 decimals (D-08). Display as a percentage to ONE decimal. Never derive
            the escalation state by comparing this to a threshold in the client — read
            escalation.escalated, which is authoritative.
        reasoning: { type: string }
        evidence_references:
          type: array
          items: { type: string }
        decisive_facts:
          type: array
          description: >-
            Facts that materially determine the ruling, each linked to its supporting evidence IDs. For safety
            incidents, automatic rulings require at least one decisive fact, non-empty evidence references for
            every decisive fact, and every referenced record to resolve as verified evidence. Missing or unknown
            evidence causes escalation.
          items:
            type: object
            required: [fact, evidence_references]
            properties:
              fact: { type: string, minLength: 1 }
              citations:
                type: array
                description: Required on decisive facts in new source-backed rulings; field/value checked by the server. Historical records may omit it.
                items: { $ref: '#/components/schemas/Citation' }
              evidence_references:
                type: array
                items: { type: string }
        policy_references:
          type: array
          items: { type: string }
        precedent_references:
          type: array
          items: { type: string, pattern: '^DSP-\d{6}$' }
          description: Must resolve to archive-table records only. Advisory, never binding.
        precedent_binding: { type: boolean, default: false }
        measurements:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: boolean
              - type: string
          description: Factual numeric, boolean, or text measurements, e.g. deviation_pct, service_tier, or filing_asserts_fee.
        escalation: { $ref: '#/components/schemas/Escalation' }
        provider: { $ref: '#/components/schemas/Provider' }

    ExternalFinding:
      type: object
      required: [source_url, retrieved_at, reliability, evaluation, summary]
      properties:
        source_url: { type: string, format: uri }
        retrieved_at: { type: string, format: date-time }
        reliability: { type: string, enum: [high, medium, low, unknown] }
        evaluation: { type: string, enum: [accepted, rejected, inconclusive] }
        summary: { type: string }

    HistoryEvent:
      type: object
      required: [event, actor_type, at]
      properties:
        event: { type: string, example: override }
        actor_type: { type: string, enum: [agent, human, system] }
        actor_id: { type: string, nullable: true }
        at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
          description: Source fields used by citations. GPS route records may include route_map coordinates for reviewer visualization.
          properties:
            route_map:
              type: object
              description: Optional coordinates copied from the trip record. Coordinates may be absent; clients must not infer them.
              properties:
                pickup: { oneOf: [{ $ref: '#/components/schemas/MapPoint' }, { type: 'null' }] }
                dropoff: { oneOf: [{ $ref: '#/components/schemas/MapPoint' }, { type: 'null' }] }
                planned_waypoints:
                  type: array
                  items: { $ref: '#/components/schemas/MapPoint' }
                observed_samples:
                  type: array
                  items: { $ref: '#/components/schemas/MapPoint' }

    MapPoint:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        label: { type: string }
        recorded_at: { type: string, format: date-time }
        accuracy_m: { type: number, minimum: 0 }

    RecordedRuling:
      type: object
      required: [ruling_type, recommended_action, author_type, decision_origin, credibility]
      properties:
        ruling_type: { $ref: '#/components/schemas/RulingType' }
        recommended_action: { $ref: '#/components/schemas/RecommendedAction' }
        author_type: { type: string, enum: [model, human_reviewer] }
        decision_origin: { type: string, enum: [agent, human] }
        author_id: { type: string, nullable: true }
        credibility: { type: string, enum: [model_proposed, higher_than_model_proposed] }
        reason_code: { type: string, nullable: true }
        rationale: { type: string, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }

    CaseResult:
      type: object
      required:
        - case_id
        - case_source
        - ride_id
        - category
        - status
        - synthetic
        - synthetic_reasoning
        - policy_version
        - created_at
        - case_facts
        - evidence_audit
        - fraud_assessment
        - model_proposed_ruling
        - reviewer_approved_ruling
        - external_findings
        - external_unavailable
        - urgency
        - case_history
      properties:
        case_id: { type: string, pattern: '^DSP-\d{6}$' }
        case_source:
          type: string
          enum: [live, archive]
          description: Identifies the record source for read-only historical case details; it is not inferred from the ID.
        ride_id: { type: string, pattern: '^RIDE-\d{6}$' }
        category: { $ref: '#/components/schemas/Category' }
        status: { $ref: '#/components/schemas/CaseStatus' }
        synthetic: { type: boolean, description: True for generated seed records; false for company-imported source records. This flag does not change adjudication behavior. }
        synthetic_reasoning:
          type: boolean
          description: |
            True when ANY model component ran on the deterministic mock. Integrity rule I-6 requires a
            visible badge in the UI. Rendering this text as advocate or Judge reasoning without the
            badge misrepresents the system.
        policy_version: { type: string }
        created_at: { type: string, format: date-time }
        trace:
          type: array
          items: { $ref: '#/components/schemas/TraceEvent' }
        party_explanations:
          type: object
          required: [rider, driver]
          properties:
            rider: { type: string }
            driver: { type: string }
        case_facts:
          type: object
          additionalProperties: true
          description: Denormalized ride summary. Carries NO outcome fields (integrity rule I-2).
        evidence_audit:
          oneOf:
            - $ref: '#/components/schemas/EvidenceAudit'
            - type: 'null'
        fraud_assessment:
          oneOf:
            - $ref: '#/components/schemas/FraudAssessment'
            - type: 'null'
        advocates:
          oneOf:
            - $ref: '#/components/schemas/Advocates'
            - type: 'null'
        judge:
          oneOf:
            - $ref: '#/components/schemas/JudgeOutput'
            - type: 'null'
        model_proposed_ruling:
          oneOf:
            - $ref: '#/components/schemas/RecordedRuling'
            - type: 'null'
        reviewer_approved_ruling:
          oneOf:
            - $ref: '#/components/schemas/RecordedRuling'
            - type: 'null'
        human_review_summary: { type: string, nullable: true }
        triage:
          type: object
          nullable: true
          description: Automated evidence and urgency checks; it does not constitute a final decision.
          required: [automated, final_decision_required, next_steps, policy_sources]
          properties:
            automated: { type: boolean }
            final_decision_required: { type: boolean }
            next_steps: { type: array, items: { type: string } }
            reported_category_details: { type: object, additionalProperties: true }
            published_claim_cap_cents: { type: integer, nullable: true }
            reported_item_status: { type: string, nullable: true }
            verified_evidence_ids: { type: array, items: { type: string } }
            unverified_evidence_ids: { type: array, items: { type: string } }
            policy_sources:
              type: array
              items:
                type: object
                required: [rule_id, text]
                properties:
                  rule_id: { type: string }
                  text: { type: string }
                  source:
                    type: object
                    nullable: true
                    properties:
                      url: { type: string }
                      title: { type: string }
                      retrieved_at: { type: string }
        external_findings:
          type: array
          items: { $ref: '#/components/schemas/ExternalFinding' }
        external_unavailable: { type: boolean }
        urgency: { type: number, minimum: 0, maximum: 1 }
        case_history:
          type: array
          items: { $ref: '#/components/schemas/HistoryEvent' }

    EvidenceAudit:
      type: object
      required: [findings, provider]
      properties:
        findings:
          type: array
          items:
            type: object
            required: [party, claim_text, classification, confidence, explanation, evidence_references, materiality]
            properties:
              party: { type: string, enum: [rider, driver] }
              claim_text: { type: string }
              classification: { type: string, enum: [contradicted, incorrect, fabrication_suspected, unsupported, consistent, inconclusive] }
              confidence: { type: number, minimum: 0, maximum: 1 }
              explanation: { type: string }
              evidence_references:
                type: array
                items: { type: string }
              materiality:
                type: string
                enum: [material, non_material, unknown]
                description: Whether this finding affects a fact decisive to the ruling. Unknown counts as material for safety eligibility.
        provider: { $ref: '#/components/schemas/Provider' }

    FraudAssessment:
      type: object
      required: [risk_score, confidence, influence_weight, findings, provider]
      properties:
        risk_score: { type: number, minimum: 0, maximum: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        influence_weight: { type: number, minimum: 0 }
        assessment_note: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [finding_type, party, summary, source_fields, evidence_ids]
            properties:
              finding_type: { type: string, enum: [prior_dispute_density, claim_evidence_mismatch, unsupported_claim_pattern, potentially_fabricated_reference] }
              party: { type: string, enum: [rider, driver, both, unknown] }
              summary: { type: string }
              source_fields:
                type: array
                items: { type: string }
              evidence_ids:
                type: array
                items: { type: string }
        provider: { $ref: '#/components/schemas/Provider' }

    CaseSummary:
      type: object
      required: [case_id, case_source, ride_id, category, status, urgency, needs_review, created_at, synthetic_reasoning, filed_by, provider]
      properties:
        case_id: { type: string, pattern: '^DSP-\d{6}$' }
        case_source:
          type: string
          enum: [live, archive]
          description: Identifies whether this mixed dispute-list item comes from live tribunal cases or historical archive cases.
        ride_id: { type: string, pattern: '^RIDE-\d{6}$' }
        category: { $ref: '#/components/schemas/Category' }
        status: { $ref: '#/components/schemas/CaseStatus' }
        confidence: { type: number, nullable: true, minimum: 0, maximum: 1 }
        ruling_type:
          oneOf:
            - $ref: '#/components/schemas/RulingType'
            - type: 'null'
        urgency: { type: number, minimum: 0, maximum: 1 }
        needs_review: { type: boolean }
        created_at: { type: string, format: date-time }
        synthetic_reasoning: { type: boolean }
        filed_by: { type: string, enum: [rider, driver] }
        provider: { type: string, nullable: true, description: Model provider display name or "local deterministic" }

    CaseSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CaseSummary' }
        next_cursor: { type: string, nullable: true }

    ArchiveRulingSummary:
      type: object
      required: [stage, verdict, ruling_type, recommended_action, amount_cents, currency, confidence, decision_origin, decided_at]
      properties:
        stage: { type: string, enum: [model_proposed, reviewer_approved] }
        verdict: { type: string, enum: [refund, compensation, no_action, escalated] }
        ruling_type: { $ref: '#/components/schemas/RulingType' }
        recommended_action: { type: string }
        amount_cents: { type: integer, minimum: 0 }
        currency: { type: string, const: SGD }
        confidence: { type: number, nullable: true, minimum: 0, maximum: 1 }
        decision_origin: { type: string, enum: [agent, human] }
        decided_at: { type: string, format: date-time }

    ArchiveDisputeSummary:
      type: object
      required: [archive_case_id, archive_ride_id, category, subject, filed_by, created_at, policy_version, status, verdict, ruling_type, recommended_action, amount_cents, currency, confidence, decision_origin, human_reviewed, rulings, synthetic]
      properties:
        archive_case_id: { type: string, pattern: '^DSP-\d{6}$' }
        archive_ride_id: { type: string, pattern: '^RIDE-\d{6}$' }
        category: { $ref: '#/components/schemas/Category' }
        subject: { type: string }
        filed_by: { type: string, enum: [rider, driver] }
        created_at: { type: string, format: date-time }
        policy_version: { type: string }
        status: { type: string, enum: [resolved, pending_review, escalated] }
        verdict: { type: string, enum: [refund, compensation, no_action, escalated] }
        ruling_type: { $ref: '#/components/schemas/RulingType' }
        recommended_action: { type: string }
        amount_cents: { type: integer, minimum: 0 }
        currency: { type: string, const: SGD }
        confidence: { type: number, nullable: true, minimum: 0, maximum: 1 }
        decision_origin: { type: string, enum: [agent, human] }
        human_reviewed: { type: boolean }
        rulings:
          type: array
          items: { $ref: '#/components/schemas/ArchiveRulingSummary' }
        synthetic: { type: boolean }

    ArchiveDisputePage:
      type: object
      required: [items, statistics]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArchiveDisputeSummary' }
        statistics:
          type: object
          required: [total, reviewer_approved, model_only, escalated, ongoing]
          properties:
            total: { type: integer, minimum: 0 }
            reviewer_approved: { type: integer, minimum: 0 }
            model_only: { type: integer, minimum: 0 }
            escalated: { type: integer, minimum: 0 }
            ongoing: { type: integer, minimum: 0 }

    Evidence:
      type: object
      required: [evidence_id, case_id, class, source, recorded_at, provenance, verification, visibility, payload]
      properties:
        evidence_id: { type: string, pattern: '^EV-\d{6}$' }
        case_id: { type: string, pattern: '^DSP-\d{6}$' }
        class:
          type: string
          enum: [gps_telemetry, chat_log, app_event, fare, profile_history, attachment, external]
        source:
          type: string
          enum: [system_record, company_imported, rider_submitted, driver_submitted, external]
        recorded_at: { type: string, format: date-time }
        provenance:
          type: object
          properties:
            table: { type: string }
            row_ids:
              type: array
              items: { type: string }
            collector: { type: string }
        verification: { $ref: '#/components/schemas/Verification' }
        visibility:
          type: string
          enum: [both, rider_only, driver_only, reviewer_only]
        payload: { type: object, additionalProperties: true }

    FileDisputeRequest:
      type: object
      required: [category, ride_id, filed_by, subject, description]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        ride_id: { type: string, pattern: '^RIDE-\d{6}$' }
        filed_by: { type: string, enum: [rider, driver] }
        subject: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        claimed_amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        category_details:
          type: object
          description: Category-specific structured facts supplied by the filer. These remain claims until verified.
          additionalProperties: true
        attachments:
          type: array
          maxItems: 5
          description: Party-submitted files are stored as unverified evidence. Up to five files, 4 MB each and 8 MB total.
          items:
            type: object
            required: [file_name, media_type, data_base64]
            properties:
              file_name: { type: string, maxLength: 120 }
              media_type: { type: string, enum: [application/pdf, image/jpeg, image/png] }
              data_base64: { type: string, contentEncoding: base64 }
      additionalProperties: false

    FileDisputeResponse:
      type: object
      required: [case_id, status]
      properties:
        case_id: { type: string, pattern: '^DSP-\d{6}$' }
        status: { $ref: '#/components/schemas/CaseStatus' }

    OverrideRequest:
      type: object
      required: [ruling_type, recommended_action, reason_code, rationale]
      properties:
        ruling_type: { $ref: '#/components/schemas/RulingType' }
        recommended_action: { $ref: '#/components/schemas/RecommendedAction' }
        reason_code: { $ref: '#/components/schemas/ReasonCode' }
        rationale: { type: string, minLength: 1, maxLength: 5000 }
      additionalProperties: false

    MetricsOverview:
      type: object
      required: [from, to, timezone, filed, auto_resolved, human_intervention]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timezone: { type: string, enum: [Asia/Singapore] }
        filed: { type: integer, minimum: 0 }
        auto_resolved: { type: integer, minimum: 0 }
        human_intervention: { type: integer, minimum: 0 }

    MetricsTimeseries:
      type: object
      required: [timezone, granularity, group_by, points]
      properties:
        timezone: { type: string, enum: [Asia/Singapore] }
        granularity: { type: string, enum: [day, week, month, year] }
        group_by: { type: string, enum: [category, status, filed_by, provider] }
        points:
          type: array
          items:
            type: object
            required: [date, series]
            properties:
              date: { type: string, format: date }
              series:
                type: array
                items:
                  type: object
                  required: [key, count]
                  properties:
                    key: { type: string }
                    count: { type: integer, minimum: 0 }

    MetricsBreakdown:
      type: object
      required: [timezone, by, slices]
      properties:
        timezone: { type: string, enum: [Asia/Singapore] }
        by: { type: string, enum: [category, status, filed_by, provider] }
        slices:
          type: array
          items:
            type: object
            required: [key, label, count]
            properties:
              key: { type: string }
              label: { type: string }
              count: { type: integer, minimum: 0 }

    AiReviewUsage:
      type: object
      required: [from, to, timezone, adjudicated_cases, gemini_review_cases, gemini_review_share, target_share, target_gap, human_review_without_model_cases, human_review_without_model_reasons, resolved_by_policy_rules, resolved_after_evidence_check, by_category]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timezone: { type: string, enum: [Asia/Singapore] }
        adjudicated_cases: { type: integer, minimum: 0 }
        gemini_review_cases: { type: integer, minimum: 0 }
        gemini_review_share: { type: number, nullable: true, minimum: 0, maximum: 1 }
        target_share: { type: number, const: 0.25 }
        target_gap: { type: number, nullable: true }
        human_review_without_model_cases: { type: integer, minimum: 0 }
        human_review_without_model_reasons:
          type: array
          items:
            type: object
            required: [reason_code, count]
            properties:
              reason_code: { type: string }
              count: { type: integer, minimum: 0 }
        resolved_by_policy_rules: { type: integer, minimum: 0 }
        resolved_after_evidence_check: { type: integer, minimum: 0 }
        by_category:
          type: array
          items:
            type: object
            required: [category, adjudicated_cases, gemini_review_cases, human_review_without_model_cases, gemini_review_share]
            properties:
              category: { type: string }
              adjudicated_cases: { type: integer, minimum: 0 }
              gemini_review_cases: { type: integer, minimum: 0 }
              human_review_without_model_cases: { type: integer, minimum: 0 }
              gemini_review_share: { type: number, nullable: true, minimum: 0, maximum: 1 }

    TripSearchPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [ride_id, booked_at, status, pickup_label, dropoff_label, rider_name, driver_name]
            properties:
              ride_id: { type: string, pattern: '^RIDE-\d{6}$', description: App-generated internal ID }
              company_trip_id: { type: string, nullable: true, description: Source company identifier }
              booked_at: { type: string, format: date-time, nullable: true }
              status: { type: string, nullable: true }
              pickup_label: { type: string, nullable: true }
              dropoff_label: { type: string, nullable: true }
              rider_name: { type: string, nullable: true }
              driver_name: { type: string, nullable: true }

    ImportResult:
      type: object
      required: [source_system, imported, skipped_duplicate_ids]
      properties:
        source_system: { type: string }
        imported: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        skipped_duplicate_ids: { type: object, additionalProperties: { type: integer, minimum: 0 } }

    PolicyDocument:
      type: object
      required: [version, rules]
      properties:
        version: { type: string }
        rules:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id: { type: string, example: RP-ROUTE-003 }
              text: { type: string }
              category: { type: string, nullable: true }
              classification: { type: string, enum: [ryde_policy, tribunal_operating_rule, historical_fictional] }
              source:
                oneOf:
                  - $ref: '#/components/schemas/PolicySource'
                  - type: 'null'
              services: { type: array, items: { type: string } }

    Health:
      type: object
      required: [status, database, provider]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unavailable] }
        provider: { type: string, enum: [ok, unavailable] }
